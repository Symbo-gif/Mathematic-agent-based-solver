name: Documentation Coverage Check

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  docstring-coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Check docstring coverage
      run: |
        python scripts/docstring_coverage_report.py
        coverage=$(python scripts/docstring_coverage_report.py 2>/dev/null | grep "OVERALL" | awk '{print $5}' | tr -d '(%)')
        echo "Coverage: ${coverage}%"
        if (( $(echo "$coverage < 100.0" | bc -l) )); then
          echo "ERROR: Docstring coverage is below 100%"
          exit 1
        fi

    - name: Validate docstring examples
      run: |
        python scripts/validate_docstring_examples.py
